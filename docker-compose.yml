# Runs the published image. To build the image locally instead:
#   docker compose -f docker-compose.build.yml up -d --build
services:
  ca-manager:
    image: ${CA_MANAGER_IMAGE:-ghcr.io/isnubi/ca-manager:latest}
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ca_data:/opt/private-ca
      - app_data:/app/data
    restart: unless-stopped

volumes:
  ca_data:
  app_data:
