{% extends 'base.html' %}
{% block title %}Login — CA Manager{% endblock %}

{% block unauthenticated_content %}
<div class="text-center mb-4">
  <img src="{{ url_for('static', filename='images/favicon.svg') }}" width="52" alt="CA Manager">
  <h1 class="h3 mt-2 fw-bold">CA Manager</h1>
  <p class="text-muted small">Homelab Certificate Authority</p>
</div>

<div class="card">
  <div class="card-body p-4">
    <h5 class="card-title mb-4">Sign in</h5>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" required autofocus autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i>Login
      </button>
    </form>
  </div>
</div>
{% endblock unauthenticated_content %}
