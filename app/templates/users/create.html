{% extends 'base.html' %}
{% block title %}Add User — CA Manager{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('users.list') }}" class="text-muted text-decoration-none small">
    <i class="bi bi-arrow-left me-1"></i>Users
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h4 class="card-title mb-4">
          <i class="bi bi-person-plus text-primary me-2"></i>Add User
        </h4>
        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
            <input type="text" name="username" class="form-control" required autofocus autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
            <select name="role" class="form-select">
              <option value="viewer">Viewer — read-only access, no private keys</option>
              <option value="operator">Operator — can issue certificates, no revoke or management</option>
              <option value="admin">Admin — full access including user management</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control" required
                   autocomplete="new-password">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
            <input type="password" name="password2" class="form-control" required autocomplete="new-password">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-person-plus me-1"></i>Create User
            </button>
            <a href="{{ url_for('users.list') }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
